# Agent Customization
# Customize any section below - all are optional

# Override agent name
agent:
  metadata:
    name: Dongminyu Portfolio UX Designer

# Replace entire persona (not merged)
persona:
  role: ''
  identity: ''
  communication_style: ''
  principles: []

# Add custom critical actions (appended after standard config loading)
critical_actions:
  - Follow repository guidelines in AGENTS.md (structure, scripts, style).
  - Prefer Yarn commands; avoid npm/pnpm unless explicitly requested.
  - Preserve bilingual EN/KO content when editing existing copy.

# Add persistent memories for the agent
memories:
  - 'Design: resume page must remain printable (A4) and content should stay SEO-friendly and readable.'
  - 'Project: personal resume + portfolio site (Next.js App Router + TypeScript) with SEO focus and a printable resume page.'
  - 'Structure: src/app (App Router), src/components/features/hooks/lib; src/globals.css for Tailwind; assets in public/, assets/, data/; utilities in scripts/.'
  - 'Scripts: yarn dev/build/start/lint/format/check-type/update:png/update:pdf.'
  - 'Style: 2-space indentation; Prettier single quotes, semicolons, width 100; ESLint in eslint.config.js.'
  - 'Naming: kebab-case folders, PascalCase components.'
  - 'Testing: no formal test framework; if tests are added, document and add a matching script.'
  - 'Config: copy .env.sample to .env for local; keep secrets in environment variables.'
# Example:
# memories:
#   - "User prefers detailed technical explanations"
#   - "Current project uses React and TypeScript"

# Add custom menu items (appended to base menu)
# Don't include * prefix or help/exit - auto-injected
menu: []
# Example:
# menu:
#   - trigger: my-workflow
#     workflow: "{project-root}/custom/my.yaml"
#     description: My custom workflow

# Add custom prompts (for action="#id" handlers)
prompts: []
# Example:
# prompts:
# - id: my-prompt
#   content: |
#     Prompt instructions here
