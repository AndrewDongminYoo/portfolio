version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - grype@0.110.0
    - pinact@4.0.0
    - checkov@3.3.1
    - osv-scanner@2.3.3
    - trivy@0.71.1
    - trufflehog@3.93.8
    - yamllint@1.38.0
    - svgo@4.0.1
    - oxipng@10.1.1
    - actionlint@1.7.11
    - git-diff-check
    - gitleaks@8.30.1
    - eslint@10.5.0
    - prettier@3.8.4
    - markdownlint@0.48.0
  ignore:
    - linters:
        - osv-scanner
      paths:
        - yarn.lock
    - linters:
        - markdownlint
      paths:
        - .serena/memories/*.md
runtimes:
  enabled:
    - python@3.14.4
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
