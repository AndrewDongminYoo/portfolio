version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - checkov@3.2.500
    - osv-scanner@2.3.2
    - trivy@0.69.0
    - trufflehog@3.92.5
    - yamllint@1.38.0
    - svgo@4.0.0
    - oxipng@10.1.0
    - actionlint@1.7.10
    - git-diff-check
    - gitleaks@8.30.0
    - eslint@9.39.2
    - prettier@3.8.1
    - markdownlint@0.47.0
  ignore:
    - linters:
        - osv-scanner
      paths:
        - yarn.lock
    - linters:
        - markdownlint
      paths:
        - .serena/memories/*.md
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
