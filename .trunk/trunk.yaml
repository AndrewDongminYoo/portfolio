version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - checkov@3.2.497
    - osv-scanner@2.3.1
    - trivy@0.68.2
    - trufflehog@3.92.4
    - yamllint@1.37.1
    - svgo@4.0.0
    - oxipng@10.0.0
    - actionlint@1.7.9
    - git-diff-check
    - gitleaks@8.30.0
    - eslint@9.39.2
    - prettier@3.7.4
    - markdownlint@0.47.0
  ignore:
    - linters:
        - osv-scanner
      paths:
        - yarn.lock
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
