version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.2
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - checkov@3.2.470
    - osv-scanner@2.2.2
    - trivy@0.66.0
    - trufflehog@3.90.6
    - yamllint@1.37.1
    - svgo@4.0.0
    - oxipng@9.1.5
    - actionlint@1.7.7
    - git-diff-check
    - gitleaks@8.28.0
    - eslint@8.57.0
    - prettier@3.6.2
    - markdownlint@0.45.0
  ignore:
    - linters:
        - osv-scanner
      paths:
        - yarn.lock
  definitions:
    - name: prettier
      files:
        - typescript
        - javascript
        - json
        - css
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available