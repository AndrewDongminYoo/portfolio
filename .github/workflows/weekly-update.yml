name: Weekly resume previews

on:
  workflow_dispatch: # yamllint disable-line rule:empty-values
  schedule:
    # 매주 월요일 00:00 KST = 일요일 15:00 UTC
    - cron: 0 15 * * 0

permissions:
  contents: write

concurrency:
  group: weekly-resume
  cancel-in-progress: false

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      PREVIEW_BASE_URL: http://127.0.0.1:3000
      PUPPETEER_NO_SANDBOX: '1'
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Start server
        run: |
          nohup yarn start -- -p 3000 > .next-start.log 2>&1 &
          npx wait-on http://127.0.0.1:3000

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@v1

      - name: Generate screenshots
        run: |
          yarn update:png
          ${TRUNK_PATH:-trunk} fmt --filter=oxipng --ci-progress

      - name: Generate resume PDF (A4)
        run: yarn update:pdf

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            stamp="$(TZ=Asia/Seoul date +'%Y%m%d%H')"
            git add assets public/resume
            git commit -m "chore: update previews & pdf (${stamp})"
            git push
          else
            echo "No changes to commit."
          fi
